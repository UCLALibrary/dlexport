apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dlexport.fullname" . }}-configmap
  namespace: dlexport
  labels:
    {{- include "dlexport.labels" . | nindent 4 }}
data:
  DB_HOSTNAME: {{ .Values.dlexport.env.db_hostname }}
  DB_PORT: {{ .Values.dlexport.env.db_port }}
  DB_SID: {{ .Values.dlexport.env.db_sid }}
