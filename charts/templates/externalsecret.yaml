apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "dlexport.fullname" . }}-externalsecret
  namespace: dlexport
  {{- with .Values.externalSecrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: systems-clustersecretstore
    kind: ClusterSecretStore
  target:
    name: {{ include "dlexport.fullname" . }}-secrets
  data:
    - secretKey: "SECRET1"
      remoteRef:
        key: {{ .Values.externalSecrets.env.secret1 }}
    - secretKey: "SECRET2"
      remoteRef:
        key: {{ .Values.externalSecrets.env.secret2 }}
    - secretKey: "SECRET3"
      remoteRef:
        key: {{ .Values.externalSecrets.env.secret3 }}
