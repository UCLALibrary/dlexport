apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "dlexport.fullname" . }}-externalsecret
  namespace: dlexport
  {{- with .Values.externalSecrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: systems-clustersecretstore
    kind: ClusterSecretStore
  target:
    name: {{ include "dlexport.fullname" . }}-secrets
  data:
    - secretKey: "DB_USERNAME"
      remoteRef:
        key: {{ .Values.dlexport.externalSecrets.env.db_username }}
    - secretKey: "DB_PASSWORD"
      remoteRef:
        key: {{ .Values.dlexport.externalSecrets.env.db_password }}
