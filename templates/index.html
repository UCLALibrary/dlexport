<!DOCTYPE html>
<html lang="en">
  <head>
    <title>DLCS Metadata Export Tool</title>
    <meta charset="utf-8">
    <link rel="shortcut icon" href="http://www.library.ucla.edu/sites/all/themes/uclalib_omega/favicon.ico" type="image/vnd.microsoft.icon">
    <link rel="canonical" href="https://getbootstrap.com/docs/4.2/examples/jumbotron/">
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <!-- Custom styles for this template -->
    <style>
      /* Move down content because we have a fixed navbar that is 3.5rem tall */
      body {
        padding-top: 3.5rem;
      }
    </style>
  </head>

  <body>
     
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
      <a class="navbar-brand" href="#">DLCS Metadata Export Tool</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsExampleDefault" aria-controls="navbarsExampleDefault" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarsExampleDefault">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item active">
            <a class="navbar-brand" href="http://digital2.library.ucla.edu/">UCLA Digital Library <span class="sr-only">(current)</span></a>
          </li>
            <li>
            <a class="navbar-link" href="/edited/">Edited Items Report</a>
          </li>
            </div>
          </li>
        </ul> 
      </div>
    </nav>

    <main role="main">

      <div class="jumbotron">
        <div class="container">
          <h1 class="display-3">DLCS Metadata Export Tool</h1>
          <p>This is a tool to download UCLA's digital library metadata.</p>
        </div>
      </div>

      <div class="container">
        <div class="row">
          <div class="col-md-4">

            <form method="post">
              <div class="form-group">
                <label for="exampleFormControlSelect1">Database:</label>
                <select name="db" class="form-control" id="exampleFormControlSelect1">
                  <option selected>Select a database</option>
                  {% for db in databases %}
                  <option value="{{ db[0] }}">{{ db[0] }}</option>
                  {% endfor %}
                </select>
              </div>

              <input type="hidden" name="db" value="{{ databases[0][0] }}">

              <div class="form-group">
                <label for="exampleFormControlSelect1">Select a collection:</label>
                <select class="custom-select" name="appname" id="exampleFormControlSelect1">
                  <option selected>Select a collection</option>
                  {% for db in databases %}
                    {% for collection in db[1] %}
                  <option class="{{ db[0] }}" value="{{ collection[1] }}">{{ collection[0] }}</option>
                    {% endfor %}
                  {% endfor %}
                </select>
              </div>

              <div class="input-group mb-3">
                <input type="text" name='outfile' class="form-control" placeholder="Name your file" aria-label="Recipient's username" aria-describedby="basic-addon2">
                <div class="input-group-append">
                  <span class="input-group-text" id="basic-addon2">.csv</span>
                </div>
              </div>

              <div class="custom-control custom-checkbox">
                <input type="checkbox" name="thumbs" class="custom-control-input" id="customCheck1" checked>
                <label class="custom-control-label" for="customCheck1">Include thumbnail image file names</label>
              </div>

              <div class="custom-control custom-checkbox">
                <input type="checkbox" name="masters" class="custom-control-input" id="customCheck2" checked>
                <label class="custom-control-label" for="customCheck2">Include master image file names</label>
              </div>

              <br/>

              <div class="btn-group" role="group" aria-label="Third group">
                <button type="submit" name="submit" value="Download" class="btn-lg btn-primary">Download</button>
              </div>
            </form>

          </div> <!-- column -->
        </div> <!-- row -->

        <hr/>

      </div> <!-- /container -->

    </main>

    <footer class="container">
      <p>&copy; 2019 UC Regents</p>
    </footer>
            
    <script>
        $(document).ready(function() {

            var db_list = {{ databases|tojson|safe }};
            var default_db = "lit106";
            var hideAllExcept = function(db) {
                var i;
                for (i = 0; i < db_list.length; i += 1) {
                    database = db_list[i][0];
                    if (database != db) {
                        $("option." + database).css("display", "none");
                    }
                    else {
                        $("option." + database).css("display", ""); 
                    }
                }
                $("select[name='appname']").val($("select[name='appname'] > option." + db)[0].value);
            };

            $("select[name='db']").change(function() {
                hideAllExcept($("select[name='db']").val());
            });

            $("select[name='db']").val(default_db);
            hideAllExcept(default_db);
            $("select[name='appname']").val($("select[name='appname'] > option." + default_db)[0].value);
        });
    </script>  
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>

  </body>
</html>
